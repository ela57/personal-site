<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13201b">
  <title>Forest journey — Ethan Lam</title>
  <link rel="stylesheet" href="journey/journey.css">
</head>
<body>
  <div class="landscape" aria-hidden="true"></div>
  <div id="world" aria-hidden="true"></div>
  <header>
    <a href="index.html">Ethan Lam</a>
    <nav aria-label="Journey controls">
      <button id="motion" type="button" hidden>Use static view</button>
      <a href="index.html#work">Direct portfolio</a>
    </nav>
  </header>
  <main>
    <div class="caption">
      <h1 id="station-title">Lakeside entrance</h1>
      <p id="view-status">Illustrative simulation · Scroll to follow the shoreline.</p>
      <p id="fallback" role="status">Static landscape. The 3D journey needs JavaScript and WebGL. <a href="index.html">Open the direct portfolio.</a></p>
    </div>
    <nav class="stations" aria-label="Journey stations">
      <a href="#entrance" aria-current="location">Entrance</a>
      <a href="#observatory">Observatory</a>
      <a href="#archive">Archive</a>
      <a href="#workshop">Workshop</a>
      <a href="#clearing">Clearing</a>
      <a href="#overlook">Overlook</a>
    </nav>
    <div class="scroll-track" aria-label="Forest journey scroll route">
      <section id="entrance" aria-label="Lakeside entrance"></section>
      <section id="observatory" aria-label="Observatory"></section>
      <section id="archive" aria-label="Archive"></section>
      <section id="workshop" aria-label="Workshop"></section>
      <section id="clearing" aria-label="Clearing"></section>
      <section id="overlook" aria-label="Overlook"></section>
    </div>
  </main>
  <output id="debug" hidden aria-label="Rendering diagnostics"></output>
  <script type="module" src="journey/main.js"></script>
</body>
</html>
