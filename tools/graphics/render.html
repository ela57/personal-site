<title>Code-generated preview artwork</title>
<link rel="stylesheet" href="/lab/chess/lab.css">
<style>
@font-face{font-family:Archivo;src:url('/assets/fonts/archivo-var.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:Plex;src:url('/assets/fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400}
*{box-sizing:border-box}body{margin:0;background:#13201b}#art{width:1600px;height:1000px;overflow:hidden}#art>svg{display:block;width:1600px;height:1000px}
text{font-family:Archivo,sans-serif;fill:#ece7dc}.mono{font-family:Plex,monospace}.caption{font-size:24px;font-weight:500;letter-spacing:1.6px}.note{font-family:Plex,monospace;font-size:21px}.small{font-size:22px;letter-spacing:1.5px}.axis{font-family:Plex,monospace;font-size:23px}.heading{font-size:38px;font-weight:500;letter-spacing:.7px}
.chessMount .chessBoard{border:1px solid #9eae8e;touch-action:auto}.chessMount .chessLight{background:#485b47}.chessMount .chessDark{background:#1c2d23}.chessMount .chessPiece{fill:#13201b;stroke:#ece7dc;stroke-width:1.4}.chessMount .pieceWhite{fill:#ece7dc;stroke:#13201b}.chessMount .chessCoord{font:16px Plex,monospace;color:#ece7dc}.chessMount .chessDark .chessCoord{color:#9eae8e}.chessMount .chessSquare:disabled{opacity:1}
</style>
